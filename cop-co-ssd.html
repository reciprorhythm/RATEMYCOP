<!DOCTYPE html>
<html lang="en" style="background-color: black;">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Face + COP Object Detection</title>

<style>
body {
    font-family: Arial, sans-serif;
}

.preview-container {
    position: relative;
    width: 42%;
    margin-bottom: 20px;
}

.preview-image,
.preview-video {
    width: 100%;
    height: auto;
    display: block;
}

.face-canvas,
.cop-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.face-canvas.clickable {
    pointer-events: auto;
}

.remove-button {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 10;
    background-color: #ff4444;
    color: white;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
}
</style>
</head>

<body style="color: whitesmoke;">
<h2 onclick="location.href = '/';"><img src="static/LOGO.png"></h2>
<h3>COP-CO with FACE-API</h3>
    <h4>upload image to run cop + face detection!</h4>

<input type="file" id="imageUpload" accept="image/*,video/*" multiple />
<div id="uploadPreview"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite/dist/tf-tflite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.7/dist/face-api.js"></script>
<link rel="stylesheet" href="style.css"> 
<script>

let faceModelsLoaded = false;
let copDetector = null;

const CLASS_NAMES = ["cop", "copcar", "badge", "horsecop", "logo"];
const SCORE_THRESHOLD = 0.5;

Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri("static/models"),
    faceapi.nets.faceLandmark68Net.loadFromUri("static/models")
]).then(() => faceModelsLoaded = true);

async function loadCopModel() {
    if (!copDetector) {
        copDetector = await tflite.loadTFLiteModel("static/models/cop-api-43.tflite");
        console.log("COP model loaded");
    }
}

function setupCanvas(canvas, media) {
    const rect = media.getBoundingClientRect();

    // Bitmap size (drawing coordinates)
    canvas.width  = media.naturalWidth || media.videoWidth;
    canvas.height = media.naturalHeight || media.videoHeight;

    // CSS size (display)
    canvas.style.width  = rect.width + "px";
    canvas.style.height = rect.height + "px";
}

const uploadPreview = document.getElementById("uploadPreview");
document.getElementById("imageUpload").addEventListener("change", e => {
    for (const file of e.target.files) {
        if (file.type.startsWith("video/")) {
            // video support can be added later safely
            console.warn("Video COP detection not wired yet.");
        } else {
            handleImage(file);
        }
    }
});

function handleImage(file) {
    const reader = new FileReader();
    reader.onload = e => {
        const img = document.createElement("img");
        img.src = e.target.result;
        img.className = "preview-image";

        const container = document.createElement("div");
        container.className = "preview-container";

         const removeBtn = document.createElement("button");
        removeBtn.className = "remove-button";
        removeBtn.textContent = "Remove";
        removeBtn.onclick = () => container.remove();  // removes container and everything inside
        container.appendChild(removeBtn);
        container.appendChild(img);

        uploadPreview.appendChild(container);

        img.onload = async () => {
            await loadCopModel();
            runFaceDetection(img, container);
            runCopDetection(img, container);
        };
    };
    reader.readAsDataURL(file);
}

async function runFaceDetection(media, container) {
    if (!faceModelsLoaded) return;

    const detections = await faceapi
        .detectAllFaces(media, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.65 }))
        .withFaceLandmarks();

    const canvas = faceapi.createCanvasFromMedia(media);
    canvas.className = "face-canvas clickable";
    container.appendChild(canvas);

    setupCanvas(canvas, media);

    const size = {
        width: media.naturalWidth,
        height: media.naturalHeight
    };

    faceapi.matchDimensions(canvas, size);
    const resized = faceapi.resizeResults(detections, size);

    faceapi.draw.drawDetections(canvas, resized);
    faceapi.draw.drawFaceLandmarks(canvas, resized);
}

/** Unwrap tf.Tensor.array() nesting like [[[...]]] -> [...] */
function unwrapBatch(arr) {
    let a = arr;
    while (Array.isArray(a) && a.length === 1) a = a[0];
    return a;
}

/** Rank-3 box layouts only (never treat [1,K] scores as K/4 fake boxes). */
function rowsFromBoxTensor3d(data, shape) {
    if (shape.length === 3 && shape[2] === 4) {
        const rows = unwrapBatch(data);
        return rows.map((r) => (Array.isArray(r) ? [...r] : Array.from(r)));
    }
    if (shape.length === 3 && shape[1] === 4) {
        const plane = data[0];
        const n = shape[2];
        const rows = [];
        for (let i = 0; i < n; i++) {
            rows.push([plane[0][i], plane[1][i], plane[2][i], plane[3][i]]);
        }
        return rows;
    }
    return null;
}

/** Fallback when the model exposes boxes as one flat [1, 4*N] tensor. */
function rowsFromFlatBoxBatch(data, shape) {
    if (shape.length !== 2 || shape[1] < 4 || shape[1] % 4 !== 0) return null;
    const flat = unwrapBatch(data);
    const rows = [];
    for (let i = 0; i < flat.length; i += 4) rows.push(flat.slice(i, i + 4));
    return rows;
}

function rowLooksLikeScores(row) {
    if (!row || !row.length) return false;
    const n = Math.min(row.length, 48);
    let max = -Infinity;
    for (let i = 0; i < n; i++) if (row[i] > max) max = row[i];
    return max <= 1.00001;
}

/**
 * TFLite converter order does not always match Model Maker metadata.
 * Pick boxes by shape [1,N,4] (or [1,4,N] / flat), scores vs classes by value range.
 */
async function decodeCopTfliteOutputs(output) {
    const items = await Promise.all(
        Object.entries(output).map(async ([key, tensor]) => ({
            key,
            tensor,
            shape: tensor.shape.slice(),
            data: await tensor.array(),
        }))
    );

    const rank2 = items.filter(
        (it) => it.shape.length === 2 && it.shape[0] === 1 && it.shape[1] > 1
    );
    const tiny = items.filter((it) => it.shape.reduce((a, b) => a * b, 1) <= 4);

    let scoresRow = null;
    let classesRow = null;
    if (rank2.length >= 2) {
        const a = unwrapBatch(rank2[0].data);
        const b = unwrapBatch(rank2[1].data);
        const a0 = Array.isArray(a[0]) ? a[0] : a;
        const b0 = Array.isArray(b[0]) ? b[0] : b;
        if (rowLooksLikeScores(a0) && !rowLooksLikeScores(b0)) {
            scoresRow = a0;
            classesRow = b0;
        } else if (!rowLooksLikeScores(a0) && rowLooksLikeScores(b0)) {
            scoresRow = b0;
            classesRow = a0;
        } else {
            scoresRow = a0;
            classesRow = b0;
        }
    } else if (rank2.length === 1) {
        const r = unwrapBatch(rank2[0].data);
        const row = Array.isArray(r[0]) ? r[0] : r;
        if (rowLooksLikeScores(row)) scoresRow = row;
        else classesRow = row;
    }

    if (!scoresRow || !classesRow) {
        throw new Error("COP model: could not split score/class outputs");
    }

    const rank2Lens = new Set(rank2.map((it) => it.shape[1]));
    const boxCandidates = [];
    for (const it of items) {
        const rows = rowsFromBoxTensor3d(it.data, it.shape);
        if (rows && rows.length && rows[0].length === 4) boxCandidates.push(rows);
    }

    let boxRows =
        boxCandidates.find((rows) => rank2Lens.has(rows.length)) ?? boxCandidates[0] ?? null;

    if (!boxRows) {
        for (const it of items) {
            if (rank2.includes(it)) continue;
            const rows = rowsFromFlatBoxBatch(it.data, it.shape);
            if (rows && rows.length && rows[0].length === 4) {
                boxRows = rows;
                break;
            }
        }
    }

    if (!boxRows) {
        throw new Error("COP model: no output tensor shaped like boxes [1,N,4]");
    }

    let numReported = boxRows.length;
    if (tiny.length) {
        const raw = unwrapBatch(tiny[0].data);
        const flat = Array.isArray(raw) ? raw.flat(Infinity) : [raw];
        const n = Math.round(Number(flat[0]));
        if (Number.isFinite(n) && n >= 0) numReported = n;
    }

    const count = Math.min(
        boxRows.length,
        scoresRow.length,
        classesRow.length,
        numReported
    );

    return { boxRows, scoresRow, classesRow, count };
}

async function runCopDetection(media, container) {
    const copCanvas = document.createElement("canvas");
    copCanvas.className = "cop-canvas";
    container.appendChild(copCanvas);

    setupCanvas(copCanvas, media);
    const ctx = copCanvas.getContext("2d");

    const input = tf.tidy(() => {
        let t = tf.browser.fromPixels(media);
        t = tf.image.resizeBilinear(t, [448, 448]);
        t = tf.cast(t, "int32");
        return tf.expandDims(t, 0);
    });

    const output = await copDetector.predict(input);
    const { boxRows, scoresRow, classesRow, count } = await decodeCopTfliteOutputs(output);

    drawCopBoxes(ctx, boxRows, classesRow, scoresRow, count, copCanvas);

    tf.dispose([input, ...Object.values(output)]);
}

function drawCopBoxes(ctx, boxes, classes, scores, num, canvas) {
    ctx.lineWidth = 2;
    ctx.font = "14px Arial";

    for (let i = 0; i < num; i++) {
        if (scores[i] < SCORE_THRESHOLD) continue;

        const quad = boxes[i];
        if (!quad || typeof quad[Symbol.iterator] !== "function") continue;
        const coords = Array.from(quad);
        if (coords.length < 4) continue;
        const [ymin, xmin, ymax, xmax] = coords;

        const x = xmin * canvas.width;
        const y = ymin * canvas.height;
        const w = (xmax - xmin) * canvas.width;
        const h = (ymax - ymin) * canvas.height;

        const id = Math.round(classes[i]);
        const label = CLASS_NAMES[id] ?? `class_${id}`;

        ctx.strokeStyle = "red";
        ctx.strokeRect(x, y, w, h);

        ctx.fillStyle = "red";
        ctx.fillText(
            `${label}: ${scores[i].toFixed(2)}`,
            x,
            y > 14 ? y - 4 : 14
        );
    }
}
</script>
</body>
</html>
