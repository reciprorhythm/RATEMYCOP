<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        
        .header {
            background-color: #333;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #555;
        }
        
        .header h1 {
            margin: 0;
            font-size: 24px;
            color: #ffffff;
        }
        
        .map-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 80px);
        }
        
        #map {
            width: 100%;
            height: 100%;
            background-color: #2a2a2a;
        }
        
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #555;
            min-width: 250px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #ffffff;
        }
        
        .control-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: #333;
            color: #ffffff;
            box-sizing: border-box;
        }
        
        .control-group input:focus {
            outline: none;
            border-color: #777;
        }
        
        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px 0;
            width: 100%;
        }
        
        .btn:hover {
            background-color: #45a049;
        }
        
        .btn.secondary {
            background-color: #2196F3;
        }
        
        .btn.secondary:hover {
            background-color: #1976D2;
        }
        
        .btn.danger {
            background-color: #f44336;
        }
        
        .btn.danger:hover {
            background-color: #da190b;
        }
        
        .coordinates-display {
            background-color: rgba(0, 0, 0, 0.9);
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid #555;
        }
        
        .marker-info {
            background-color: rgba(0, 0, 0, 0.9);
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            border: 1px solid #555;
        }
        
        .marker-info h4 {
            margin: 0 0 10px 0;
            color: #4CAF50;
        }
        
        .marker-list {
            max-height: 150px;
            overflow-y: auto;
        }
        
        .marker-item {
            padding: 5px;
            border-bottom: 1px solid #333;
            font-size: 12px;
        }
        
        .marker-item:last-child {
            border-bottom: none;
        }
        
        .remove-marker {
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 10px;
            margin-left: 10px;
        }
        
        .remove-marker:hover {
            background-color: #da190b;
        }
        
        /* Custom map controls styling */
        .leaflet-control-zoom {
            border: 1px solid #555 !important;
            background-color: rgba(0, 0, 0, 0.8) !important;
        }
        
        .leaflet-control-zoom a {
            background-color: #333 !important;
            color: #ffffff !important;
            border: 1px solid #555 !important;
        }
        
        .leaflet-control-zoom a:hover {
            background-color: #555 !important;
        }
        
        .leaflet-control-attribution {
            background-color: rgba(0, 0, 0, 0.8) !important;
            color: #ffffff !important;
            border: 1px solid #555 !important;
        }
    </style>
</head>
<body>
    <div class="header">
    </div>
    
    <div class="map-container">
        <div id="map"></div>
        
        <div class="controls">
            <div class="control-group">
                <label for="addressSearch">Search Address:</label>
                <input type="text" id="addressSearch" placeholder="Enter address or place name">
                <button class="btn secondary" onclick="searchAddress()">Search</button>
            </div>
            
            <div class="control-group">
                <button class="btn" onclick="useCurrentLocation()">📍 Use Current Location</button>
            </div>
            
            <div class="control-group">
                <label for="latitude">Latitude:</label>
                <input type="text" id="latitude" readonly>
                <label for="longitude">Longitude:</label>
                <input type="text" id="longitude" readonly>
            </div>
            
            <div class="coordinates-display">
                <strong>Coordinates:</strong><br>
                <span id="coordinatesDisplay">Click on map to select location</span>    
            </div>
            
            <div class="control-group">
                <button class="btn" onclick="addMarker()">➕ Add Marker</button>
                <button class="btn danger" onclick="clearAllMarkers()">��️ Clear All</button>
            </div>
            
            <div class="marker-info">
                <h4>Markers (0)</h4>
                <div class="marker-list" id="markerList">
                    <div class="marker-item">No markers added yet</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Initialize map centered on Canada with proper options
        const map = L.map('map', {
            center: [56.1304, -106.3468],
            zoom: 4,
            zoomControl: true,
            attributionControl: true,
            // Ensure proper z-index for drawing layers
            zIndexOffset: 1000
        });
        
        // Add OpenStreetMap tiles with proper attribution
        const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        
        // Create a FeatureGroup to store all editable layers (best practice from docs)
        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);
        
        // Store markers with proper Leaflet layer management
        let markers = [];
        let currentMarker = null;
        
        // Initialize coordinate display
        document.getElementById('latitude').value = '56.1304';
        document.getElementById('longitude').value = '-106.3468';
       // document.getElementById('coordinatesDisplay').textContent = '56.1304, -106.3468';
        
        // Map click handler with proper event handling
        map.on('click', function(e) {
            const lat = e.latlng.lat.toFixed(6);
            const lng = e.latlng.lng.toFixed(6);
            
            // Update coordinate display
           document.getElementById('latitude').value = lat;
           document.getElementById('longitude').value = lng;
          //  document.getElementById('coordinatesDisplay').textContent = `${lat}, ${lng}`;
            
            // Remove previous temporary marker using proper layer removal
            if (currentMarker) {
                map.removeLayer(currentMarker);
                currentMarker = null;
            }
            
            // Add temporary marker with proper icon configuration
            currentMarker = L.marker(e.latlng, {
                icon: L.divIcon({
                    className: 'temp-marker',
                    html: '📍',
                    iconSize: [24, 24],
                    iconAnchor: [12, 24],
                    // Ensure proper z-index for temporary markers
                    zIndexOffset: 2000
                }),
                // Use proper zIndexOffset as recommended in docs
                zIndexOffset: 2000
            }).addTo(map);
            
            // Auto-remove temporary marker after 3 seconds
            setTimeout(() => {
                if (currentMarker && map.hasLayer(currentMarker)) {
                    map.removeLayer(currentMarker);
                    currentMarker = null;
                }
            }, 3000);
        });
        
        // Search address function with proper error handling
        async function searchAddress() {
            const address = document.getElementById('addressSearch').value;
            if (!address) return;
            
            try {
                // Use OpenStreetMap Nominatim API for geocoding
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&countrycodes=ca&limit=1`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.length > 0) {
                    const result = data[0];
                    const lat = parseFloat(result.lat);
                    const lon = parseFloat(result.lon);
                    
                    // Update map view with proper bounds checking
                    if (lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
                        map.setView([lat, lon], 15);
                        
                        // Update coordinate display
                      document.getElementById('latitude').value = lat.toFixed(6);
                       document.getElementById('longitude').value = lon.toFixed(6);
                      //  document.getElementById('coordinatesDisplay').textContent = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
                        
                        // Add temporary marker using proper layer management
                        if (currentMarker && map.hasLayer(currentMarker)) {
                            map.removeLayer(currentMarker);
                        }
                        
                        currentMarker = L.marker([lat, lon], {
                            icon: L.divIcon({
                                className: 'temp-marker',
                                html: '📍',
                                iconSize: [24, 24],
                                iconAnchor: [12, 24],
                                zIndexOffset: 2000
                            }),
                            zIndexOffset: 2000
                        }).addTo(map);
                        
                        // Auto-remove after 5 seconds
                        setTimeout(() => {
                            if (currentMarker && map.hasLayer(currentMarker)) {
                                map.removeLayer(currentMarker);
                                currentMarker = null;
                            }
                        }, 5000);
                        
                    } else {
                        alert('Invalid coordinates returned from search.');
                    }
                } else {
                    alert('Address not found. Please try a different search term.');
                }
            } catch (error) {
                console.error('Error searching address:', error);
                alert('Error searching address. Please try again.');
            }
        }
        
        // Use current location with proper error handling
        function useCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        // Validate coordinates before using
                        if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                            // Update map view
                            map.setView([lat, lng], 15);
                            
                            // Update coordinate display
                        //    document.getElementById('latitude').value = lat.toFixed(6);
                        //    document.getElementById('longitude').value = lng.toFixed(6);
                            document.getElementById('coordinatesDisplay').textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                            
                            // Add temporary marker using proper layer management
                            if (currentMarker && map.hasLayer(currentMarker)) {
                                map.removeLayer(currentMarker);
                            }
                            
                            currentMarker = L.marker([lat, lng], {
                                icon: L.divIcon({
                                    className: 'temp-marker',
                                    html: '📍',
                                    iconSize: [24, 24],
                                    iconAnchor: [12, 24],
                                    zIndexOffset: 2000
                                }),
                                zIndexOffset: 2000
                            }).addTo(map);
                            
                            // Auto-remove after 5 seconds
                            setTimeout(() => {
                                if (currentMarker && map.hasLayer(currentMarker)) {
                                    map.removeLayer(currentMarker);
                                    currentMarker = null;
                                }
                            }, 5000);
                            
                        } else {
                            alert('Invalid coordinates received from GPS.');
                        }
                    },
                    function(error) {
                        console.error('Error getting location:', error);
                        let errorMessage = 'Unable to get your location.';
                        
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                errorMessage += ' Please check your browser permissions.';
                                break;
                            case error.POSITION_UNAVAILABLE:
                                errorMessage += ' Location information unavailable.';
                                break;
                            case error.TIMEOUT:
                                errorMessage += ' Request timed out.';
                                break;
                            default:
                                errorMessage += ' Unknown error occurred.';
                        }
                        
                        alert(errorMessage);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 60000
                    }
                );
            } else {
                alert('Geolocation is not supported by this browser.');
            }
        }
        
        // Center map on Canada with proper bounds
        function centerOnCanada() {
            // Use proper bounds for Canada
            const canadaBounds = L.latLngBounds(
                L.latLng(41.7, -141.0),  // Southwest
                L.latLng(83.3, -52.6)    // Northeast
            );
            
            map.fitBounds(canadaBounds, { padding: [20, 20] });
            
            // Clear temporary marker using proper layer management
            if (currentMarker && map.hasLayer(currentMarker)) {
                map.removeLayer(currentMarker);
                currentMarker = null;
            }
            
            // Reset coordinates to Canada center
          //  document.getElementById('latitude').value = '56.1304';
           // document.getElementById('longitude').value = '-106.3468';
            document.getElementById('coordinatesDisplay').textContent = '56.1304, -106.3468';
        }
        
        // Add permanent marker with proper layer management
        function addMarker() {
            const lat = document.getElementById('latitude').value;
            const lng = document.getElementById('longitude').value;
            
            if (!lat || !lng) {
                alert('Please select a location on the map first.');
                return;
            }
            
            // Validate coordinates
            const latNum = parseFloat(lat);
            const lngNum = parseFloat(lng);
            
            if (isNaN(latNum) || isNaN(lngNum) || 
                latNum < -90 || latNum > 90 || 
                lngNum < -180 || lngNum > 180) {
                alert('Invalid coordinates. Please select a valid location.');
                return;
            }
            
            // Create marker with proper configuration
            const marker = L.marker([latNum, lngNum], {
                icon: L.divIcon({
                    className: 'permanent-marker',
                    html: '🛡️',
                    iconSize: [24, 24],
                    iconAnchor: [12, 24],
                    zIndexOffset: 2000
                }),
                zIndexOffset: 2000
            });
            
            // Add popup with coordinates using proper popup configuration
            marker.bindPopup(`Location: ${lat}, ${lng}`, {
                closeButton: true,
                closeOnClick: false,
                autoClose: false
            });
            
            // Add to both the map and the FeatureGroup for proper management
            marker.addTo(map);
            drawnItems.addLayer(marker);
            
            // Store marker with proper metadata
            markers.push({
                id: Date.now(),
                lat: latNum,
                lng: lngNum,
                marker: marker
            });
            
            // Update marker list
            updateMarkerList();
            
            // Clear temporary marker using proper layer management
            if (currentMarker && map.hasLayer(currentMarker)) {
                map.removeLayer(currentMarker);
                currentMarker = null;
            }
        }
        
        // Clear all markers using proper layer management
        function clearAllMarkers() {
            // Remove from FeatureGroup (proper Leaflet practice)
            drawnItems.clearLayers();
            
            // Clear local array
            markers = [];
            
            // Update marker list
            updateMarkerList();
        }
        
        // Remove specific marker with proper layer management
        function removeMarker(markerId) {
            const markerIndex = markers.findIndex(m => m.id === markerId);
            if (markerIndex !== -1) {
                const marker = markers[markerIndex];
                
                // Remove from both map and FeatureGroup
                if (map.hasLayer(marker.marker)) {
                    map.removeLayer(marker.marker);
                }
                drawnItems.removeLayer(marker.marker);
                
                markers.splice(markerIndex, 1);
                updateMarkerList();
            }
        }
        
        // Update marker list display
        function updateMarkerList() {
            const markerList = document.getElementById('markerList');
            
            if (markers.length === 0) {
                markerList.innerHTML = '<div class="marker-item">No markers added yet</div>';
            } else {
                markerList.innerHTML = markers.map(marker => `
                    <div class="marker-item">
                        ${marker.lat.toFixed(6)}, ${marker.lng.toFixed(6)}
                        <button class="remove-marker" onclick="removeMarker(${marker.id})">Remove</button>
                    </div>
                `).join('');
            }
            
            // Update marker count in header
            document.querySelector('.marker-info h4').textContent = `Markers (${markers.length})`;
        }
        
        // Handle Enter key in address search
        document.getElementById('addressSearch').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchAddress();
            }
        });
        
        // Initialize marker list
        updateMarkerList();
        
        // Add some Canadian cities as reference points with proper configuration
        const canadianCities = [
            { name: 'Toronto', lat: 43.6532, lng: -79.3832 },
            { name: 'Montreal', lat: 45.5017, lng: -73.5673 },
            { name: 'Vancouver', lat: 49.2827, lng: -123.1207 },
            { name: 'Calgary', lat: 51.0447, lng: -114.0719 },
            { name: 'Edmonton', lat: 53.5461, lng: -113.4938 },
            { name: 'Ottawa', lat: 45.4215, lng: -75.6972 },
            { name: 'Winnipeg', lat: 49.8951, lng: -97.1384 },
            { name: 'Quebec City', lat: 46.8139, lng: -71.2080 }
        ];
        
        // Add city markers with proper configuration
        canadianCities.forEach(city => {
            const cityMarker = L.marker([city.lat, city.lng], {
                icon: L.divIcon({
                    className: 'city-marker',
                    html: '🏙️',
                    iconSize: [20, 20],
                    iconAnchor: [10, 20],
                    zIndexOffset: 1500
                }),
                zIndexOffset: 1500
            }).addTo(map);
            
            // Add popup with proper configuration
            cityMarker.bindPopup(`<b>${city.name}</b><br>${city.lat}, ${city.lng}`, {
                closeButton: true,
                closeOnClick: false,
                autoClose: false
            });
        });
        
        // Add proper cleanup on page unload
        window.addEventListener('beforeunload', function() {
            // Clean up any remaining layers
            if (currentMarker && map.hasLayer(currentMarker)) {
                map.removeLayer(currentMarker);
            }
            drawnItems.clearLayers();
        });
    </script>
</body>
</html>
