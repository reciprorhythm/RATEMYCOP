<!DOCTYPE html>
<html lang="en" style="background-color: black;">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Face + COP Object Detection</title>

<style>
body {
    font-family: Arial, sans-serif;
}

.preview-container {
    position: relative;
    width: 42%;
    margin-bottom: 20px;
}

.preview-image,
.preview-video {
    width: 100%;
    height: auto;
    display: block;
}

.face-canvas,
.cop-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.face-canvas.clickable {
    pointer-events: auto;
}

.remove-button {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 10;
    background-color: #ff4444;
    color: white;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
}
</style>
</head>

<body style="color: whitesmoke;">
<h2 onclick="location.href = '/';"><img src="static/LOGO.png"></h2>
<h3>COP-CO with FACE-API</h3>
    <h4>upload image to run cop + face detection!</h4>

<input type="file" id="imageUpload" accept="image/*,video/*" multiple />
<div id="uploadPreview"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.7/dist/face-api.js"></script>
<link rel="stylesheet" href="style.css"> 
<script>

let faceModelsLoaded = false;
let copDetector = null;
let litert = null; // { loadLiteRt, loadAndCompile, Tensor }

// Ultralytics LiteRT export needs LiteRT.js — legacy tfjs-tflite cannot run it.
const LITERT_ESM = "https://cdn.jsdelivr.net/npm/@litertjs/core@2.5.3/+esm";
const LITERT_WASM = "https://cdn.jsdelivr.net/npm/@litertjs/core@2.5.3/wasm/";
const COP_MODEL_URL = "/static/models/cop-api50.tflite";

// Must match apitrain_pytorch.py CLASSES (YOLO export has 4+nc channels).
const CLASS_NAMES = ["cop", "copcar", "badge", "logo"];
const SCORE_THRESHOLD = 0.5;
const IOU_THRESHOLD = 0.45;
const IMGSZ = 448;

Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri("static/models"),
    faceapi.nets.faceLandmark68Net.loadFromUri("static/models")
]).then(() => faceModelsLoaded = true);

async function ensureLiteRt() {
    if (litert) return;
    litert = await import(LITERT_ESM);
    await litert.loadLiteRt(LITERT_WASM);
}

async function loadCopModel() {
    if (copDetector) return;
    await ensureLiteRt();
    // wasm has the widest op coverage for int8 YOLO; webgpu if wasm fails.
    try {
        copDetector = await litert.loadAndCompile(COP_MODEL_URL, { accelerator: "wasm" });
    } catch (err) {
        console.warn("LiteRT wasm compile failed, trying webgpu:", err);
        copDetector = await litert.loadAndCompile(COP_MODEL_URL, { accelerator: "webgpu" });
    }
    console.log("COP model loaded via LiteRT.js", copDetector.getInputDetails?.());
}

/** Stretch-resize media to IMGSZ and pack float32 NCHW [1,3,H,W] in 0..1. */
function imageToNchwFloat32(media, size) {
    const canvas = document.createElement("canvas");
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(media, 0, 0, size, size);
    const { data } = ctx.getImageData(0, 0, size, size);
    const plane = size * size;
    const out = new Float32Array(3 * plane);
    for (let i = 0; i < plane; i++) {
        const j = i * 4;
        out[i] = data[j] / 255;
        out[plane + i] = data[j + 1] / 255;
        out[2 * plane + i] = data[j + 2] / 255;
    }
    return out;
}

function setupCanvas(canvas, media) {
    const rect = media.getBoundingClientRect();

    // Bitmap size (drawing coordinates)
    canvas.width  = media.naturalWidth || media.videoWidth;
    canvas.height = media.naturalHeight || media.videoHeight;

    // CSS size (display)
    canvas.style.width  = rect.width + "px";
    canvas.style.height = rect.height + "px";
}

const uploadPreview = document.getElementById("uploadPreview");
document.getElementById("imageUpload").addEventListener("change", e => {
    for (const file of e.target.files) {
        if (file.type.startsWith("video/")) {
            // video support can be added later safely
            console.warn("Video COP detection not wired yet.");
        } else {
            handleImage(file);
        }
    }
});

function handleImage(file) {
    const reader = new FileReader();
    reader.onload = e => {
        const img = document.createElement("img");
        img.src = e.target.result;
        img.className = "preview-image";

        const container = document.createElement("div");
        container.className = "preview-container";

         const removeBtn = document.createElement("button");
        removeBtn.className = "remove-button";
        removeBtn.textContent = "Remove";
        removeBtn.onclick = () => container.remove();  // removes container and everything inside
        container.appendChild(removeBtn);
        container.appendChild(img);

        uploadPreview.appendChild(container);

        img.onload = async () => {
            try {
                await loadCopModel();
                runFaceDetection(img, container);
                await runCopDetection(img, container);
            } catch (err) {
                console.error("Detection failed:", err);
            }
        };
    };
    reader.readAsDataURL(file);
}

async function runFaceDetection(media, container) {
    if (!faceModelsLoaded) return;

    const detections = await faceapi
        .detectAllFaces(media, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.65 }))
        .withFaceLandmarks();

    const canvas = faceapi.createCanvasFromMedia(media);
    canvas.className = "face-canvas clickable";
    container.appendChild(canvas);

    setupCanvas(canvas, media);

    const size = {
        width: media.naturalWidth,
        height: media.naturalHeight
    };

    faceapi.matchDimensions(canvas, size);
    const resized = faceapi.resizeResults(detections, size);

    faceapi.draw.drawDetections(canvas, resized);
    faceapi.draw.drawFaceLandmarks(canvas, resized);
}

/**
 * Ultralytics YOLO LiteRT raw head: flat buffer for shape [1, 4+nc, N].
 * Boxes are normalized cx,cy,w,h; remaining channels are class scores.
 */
function normalizeShape(shape) {
    if (Array.isArray(shape)) return shape.map(Number);
    if (shape && typeof shape === "object") {
        return Object.keys(shape)
            .filter((k) => /^\d+$/.test(k))
            .sort((a, b) => Number(a) - Number(b))
            .map((k) => Number(shape[k]));
    }
    return null;
}

function decodeYoloOutput(flat, rawShape) {
    const shape = normalizeShape(rawShape);
    if (!shape || shape.length !== 3) {
        throw new Error(`COP model: unexpected output shape ${JSON.stringify(rawShape)}`);
    }
    const numChannels = shape[1];
    const numPreds = shape[2];
    const numClasses = numChannels - 4;
    if (numClasses < 1 || flat.length < numChannels * numPreds) {
        throw new Error(
            `COP model: bad YOLO layout channels=${numChannels} preds=${numPreds} len=${flat.length}`
        );
    }

    const at = (c, i) => flat[c * numPreds + i];

    const dets = [];
    for (let i = 0; i < numPreds; i++) {
        let bestScore = -Infinity;
        let bestCls = 0;
        for (let c = 0; c < numClasses; c++) {
            const s = at(4 + c, i);
            if (s > bestScore) {
                bestScore = s;
                bestCls = c;
            }
        }
        if (bestScore < SCORE_THRESHOLD) continue;

        const cx = at(0, i);
        const cy = at(1, i);
        const bw = at(2, i);
        const bh = at(3, i);
        dets.push({
            x1: cx - bw / 2,
            y1: cy - bh / 2,
            x2: cx + bw / 2,
            y2: cy + bh / 2,
            score: bestScore,
            cls: bestCls,
        });
    }

    dets.sort((a, b) => b.score - a.score);
    return nms(dets, IOU_THRESHOLD);
}

function boxIou(a, b) {
    const x1 = Math.max(a.x1, b.x1);
    const y1 = Math.max(a.y1, b.y1);
    const x2 = Math.min(a.x2, b.x2);
    const y2 = Math.min(a.y2, b.y2);
    const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
    const areaA = Math.max(0, a.x2 - a.x1) * Math.max(0, a.y2 - a.y1);
    const areaB = Math.max(0, b.x2 - b.x1) * Math.max(0, b.y2 - b.y1);
    const union = areaA + areaB - inter;
    return union > 0 ? inter / union : 0;
}

function nms(dets, iouThresh) {
    const kept = [];
    const suppressed = new Array(dets.length).fill(false);
    for (let i = 0; i < dets.length; i++) {
        if (suppressed[i]) continue;
        kept.push(dets[i]);
        for (let j = i + 1; j < dets.length; j++) {
            if (suppressed[j]) continue;
            if (dets[i].cls !== dets[j].cls) continue;
            if (boxIou(dets[i], dets[j]) > iouThresh) suppressed[j] = true;
        }
    }
    return kept;
}

function disposeLiteRtTensors(...tensors) {
    for (const t of tensors) {
        if (!t) continue;
        if (typeof t.delete === "function") t.delete();
        else if (Array.isArray(t)) disposeLiteRtTensors(...t);
        else if (typeof t === "object") disposeLiteRtTensors(...Object.values(t));
    }
}

async function runCopDetection(media, container) {
    const copCanvas = document.createElement("canvas");
    copCanvas.className = "cop-canvas";
    container.appendChild(copCanvas);

    setupCanvas(copCanvas, media);
    const ctx = copCanvas.getContext("2d");

    const data = imageToNchwFloat32(media, IMGSZ);
    const inputTensor = new litert.Tensor(data, [1, 3, IMGSZ, IMGSZ]);
    let results;
    try {
        results = await copDetector.run(inputTensor);
        const outTensor = Array.isArray(results) ? results[0] : Object.values(results)[0];
        const cpu = await outTensor.moveTo("wasm");
        const flat = cpu.toTypedArray();
        const shape =
            cpu.shape ||
            outTensor.shape ||
            copDetector.getOutputDetails?.()?.[0]?.shape ||
            [1, 4 + CLASS_NAMES.length, flat.length / (4 + CLASS_NAMES.length)];
        const dets = decodeYoloOutput(flat, shape);
        drawCopBoxes(ctx, dets, copCanvas);
        if (cpu !== outTensor) disposeLiteRtTensors(cpu);
    } finally {
        disposeLiteRtTensors(inputTensor, results);
    }
}

function drawCopBoxes(ctx, dets, canvas) {
    ctx.lineWidth = 2;
    ctx.font = "14px Arial";

    // Ultralytics LiteRT boxes are normalized xywh in 0..1 (input frame space).
    for (const det of dets) {
        const x = det.x1 * canvas.width;
        const y = det.y1 * canvas.height;
        const w = (det.x2 - det.x1) * canvas.width;
        const h = (det.y2 - det.y1) * canvas.height;
        const label = CLASS_NAMES[det.cls] ?? `class_${det.cls}`;

        ctx.strokeStyle = "red";
        ctx.strokeRect(x, y, w, h);

        ctx.fillStyle = "red";
        ctx.fillText(
            `${label}: ${det.score.toFixed(2)}`,
            x,
            y > 14 ? y - 4 : 14
        );
    }
}
</script>
</body>
</html>
